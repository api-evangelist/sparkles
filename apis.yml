aid: sparkles
name: Sparkles
description: >-
  Sparkles (sparkles.dev) is a San Francisco developer-tools startup in Y
  Combinator's Winter 2026 batch building AI coding agents for a whole team, not
  just engineers. A technical owner connects the company's GitHub repositories
  and configures environment variables, after which any teammate on a company
  email address can describe a change and have an agent implement it inside an
  isolated sandbox and open a GitHub pull request for developer review. Positioned
  as "Lovable for existing projects," it lets marketers, designers, and operations
  staff ship safe code changes without needing to know Git or the command line.
  As of this profile Sparkles exposes only a marketing and product website plus
  legal pages; it publishes no public API, developer portal, SDKs, CLI, or
  OpenAPI, so this record captures verified company identity rather than an API
  surface.
